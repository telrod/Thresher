name: Bug report
description: Something in Thresher doesn't work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please don't paste real email addresses, names or message content. Replace them with placeholders such as `person@example.com`.
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu › About This Mac.
      placeholder: "14.6.1"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Chip
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Built from source with dev-run.sh
        - Prebuilt
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When did it happen?
      options:
        - During onboarding
        - During normal use
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch Thresher
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: |
        Logs are in `~/Library/Application Support/thresher/logs/`. Settings › "Reveal Logs in Finder" opens that folder. Remove any real addresses or subjects before pasting.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Capture only the Thresher window, and hide any real mail.
    validations:
      required: false
