# CI on Apple Silicon (macos-14 hosted runners are arm64).
#
# Builds the distributable app exactly as a stranger would (scripts/build.sh),
# then runs the backend suite. The two run in sequence, never together, per
# CLAUDE.md.
#
# NOT included: the frontend XCTest suite. It drives real windows and a real
# run loop, and several tests are timing sensitive; it has not been shown to
# pass on a hosted runner. Add it only after it has.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Recorded so every run states what it was verified on.
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          /usr/bin/python3 -c 'import sys, sqlite3; print("python", sys.version.split()[0], "sqlite", sqlite3.sqlite_version)'

      - name: Build (scripts/build.sh)
        run: scripts/build.sh

      # The suite runs on /usr/bin/python3, the interpreter the bundled app
      # runs on (D68), not a newer one. A newer Python hid a crash on 3.9 that
      # only shipped users would have hit.
      - name: Install backend test dependencies
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check flask pytest

      - name: Backend suite
        working-directory: backend
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/ -q -rs --junitxml="$RUNNER_TEMP/backend.xml"

      # A skipped test is a test that did not run. The suite reaches 0 skipped
      # on a stock Mac, so a skip here means a guard silently stood down.
      - name: Require zero skipped
        run: |
          /usr/bin/python3 - "$RUNNER_TEMP/backend.xml" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"{tests} tests, {skipped} skipped")
          if tests == 0:
              sys.exit("no tests were recorded; the report is empty")
          if skipped:
              sys.exit(f"{skipped} test(s) skipped; expected 0")
          EOF
